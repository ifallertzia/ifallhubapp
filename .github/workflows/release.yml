name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "Android SDK at $SDK_ROOT"

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_ALIAS_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEYSTORE_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEYSTORE_ALIAS_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass ifallhub -keypass ifallhub \
              -alias ifallhub -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=ifallhub CI, OU=App, O=Ifallhub, C=IN"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=ifallhub"
              echo "ANDROID_KEYSTORE_ALIAS=ifallhub"
              echo "ANDROID_KEYSTORE_ALIAS_PASSWORD=ifallhub"
            } >> "$GITHUB_ENV"
          fi

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease
          cd app/build/outputs/apk/release
          cp app-release.apk "ifallhub-${{ github.event.inputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/ifallhub-${{ github.event.inputs.version }}.apk
          tag_name: v${{ github.event.inputs.version }}
          name: Ifallhub Android v${{ github.event.inputs.version }}
          body: |
            ## Ifallhub Android App

            Full-featured movie streaming app with H.265/HEVC support via Mobile-FFmpeg.

            ### Features
            - Browse movies, series, and anime (Discover)
            - Search across multiple providers
            - Video playback with H.265/HEVC + MKV support (Mobile-FFmpeg)
            - Server rotation with auto-fallback
            - Quality selection, subtitles, episode navigation, auto-play next
            - Watchlist, ratings and progress tracking
            - Tracker dashboard and personalised recommendations

            ### Download
            [Download APK](https://github.com/${{ github.repository }}/releases/download/v${{ github.event.inputs.version }}/ifallhub-${{ github.event.inputs.version }}.apk)

            App name: **ifallhub** · Package: `com.ifallhub.app` · Android 8.0+ (API 26+)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
